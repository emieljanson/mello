# Makes a release: tags a version of main as vYYYY.MM.DD so speakers on the
# stable channel pick it up at their next nightly update (03:00).
# Start it from GitHub: Actions → Release → Run workflow.
# Speakers on the beta channel (MELLO_UPDATE_CHANNEL=beta) already run main.
#
# Best practice: release the main commit the beta speakers have run for a
# while (see `git log --first-parent main`), not one merged an hour ago.
name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit on main to release (empty = newest main)'
        required: false
        default: ''

permissions:
  contents: read

concurrency: release

jobs:
  # Never release something with failing tests. This job installs packages
  # and runs code, so it gets no write access to the repository.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Stable speakers never go backwards, so only a commit on main may be
      # released; anything else (a branch, a typo) would strand them.
      - id: sha
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          sha=$(git rev-parse --verify --quiet "${COMMIT:-HEAD}^{commit}") \
            || { echo "::error::Unknown commit: $COMMIT"; exit 1; }
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::$sha is not on main"
            exit 1
          fi
          # A release older than the previous one would look "older" to
          # stable speakers and could pull re-cloned ones back.
          latest_tag=$(git for-each-ref --count=1 --sort=-v:refname \
            --format='%(refname:short)' 'refs/tags/v*')
          if [ -n "$latest_tag" ] && \
             ! git merge-base --is-ancestor "$latest_tag^{commit}" "$sha"; then
            echo "::error::$sha is older than the latest release $latest_tag"
            exit 1
          fi
          git checkout --quiet "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Speakers decide where to update with the update-target.sh of the
      # version they run. A version without go-librespot (pi/needs-soloist)
      # may only be released once the previous release has the gate that
      # keeps librespot speakers back, or they would jump to it unprotected.
      - name: Librespot speakers are protected
        run: |
          [ -e pi/needs-soloist ] || exit 0
          prev=$(git for-each-ref --count=1 --sort=-v:refname \
            --format='%(refname:short)' 'refs/tags/v*')
          if [ -z "$prev" ] || ! git show "$prev:pi/update-target.sh" | grep -q needs-soloist; then
            echo "::error::Release a version with the needs-soloist gate (but without pi/needs-soloist) first; the newest release (${prev:-none}) lacks it"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests -q

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.test.outputs.sha }}
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=2
          while gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; do
            tag="$base.$n"
            n=$((n + 1))
          done
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
          echo "Released $tag (${SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
