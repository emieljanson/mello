# Runs the test suite on every pull request (and on main after a merge),
# so a broken change shows up as a red cross before it reaches a speaker.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Raspberry Pi OS Trixie ships Python 3.13.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # On the Pi pygame comes from apt (see requirements.txt); here pip
      # provides it, so the screen tests run too.
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pygame

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest tests -q

      # The update scripts run on every speaker at night; a syntax error there
      # would stop speakers from ever updating again.
      - name: Check shell scripts
        run: for f in install.sh dev-pi.sh pi/*.sh pi/soloist/*.sh; do bash -n "$f"; done
