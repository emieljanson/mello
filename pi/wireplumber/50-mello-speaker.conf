# Mello's own speaker is the WM8960 sound card. The Pi also has a headphone
# jack (and HDMI audio), and PipeWire gives all of them the same priority, so
# on a speaker that never chose an output it picked the headphone jack: Soloist
# then played into a socket nothing is plugged into and the speaker stayed
# silent. go-librespot never noticed, it writes straight to the WM8960 via ALSA.
#
# Ranking the speaker above the other outputs makes it the default whenever
# nothing else was chosen. Bluetooth still works: Mello sets Bluetooth
# headphones as the default explicitly, and back to the speaker afterwards.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "wm8960-soundcard", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
]
