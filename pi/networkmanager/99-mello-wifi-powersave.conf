# Installed by Mello (pi/setup.sh, pi/migrate.sh migration 017).
# Keep the WiFi chip awake. With power save on, the Pi's brcmfmac chip dozes
# between beacons and the router drops it ("reason=6/7" disconnects in
# wpa_supplicant), so the speaker loses Spotify several times a day.
# 2 = disable power save for every WiFi connection NetworkManager activates.
[connection]
wifi.powersave = 2
